{
    // Default HTTP(S) address:port to listen on for websocket. Either a
	// numeric or a canonical name, e.g. ":80" or ":https". Could include a host name, e.g.
	// "localhost:80".
	// Could be blank: if TLS is not configured, will use ":80", otherwise ":443".
	// Can be overridden from the command line, see option --listen.
	"listen": ":6060",

	// Default HTTP(S) address:port to listen on for grpc. Either a
	// numeric or a canonical name, e.g. ":80" or ":https". Could include a host name, e.g.
	// "localhost:80".
	// Could be blank: if TLS is not configured, will use ":80", otherwise ":443".
	// Can be overridden from the command line, see option --listen.
	"grpc_listen": ":6080",

    // Default logging level is "InfoLevel" so to enable the debug log set the "LogLevel" to "DebugLevel".
	"logging_level": "Error",

    // Maximum message size allowed from client in bytes (262144 = 256KB).
	// Intended to prevent malicious clients from sending very large messages inband (does
	// not affect out-of-band large files).
	"max_message_size": 262144,

	// Maximum number of subscribers per group topic.
	"max_subscriber_count": 128,

    // Encryption configuration
	"encryption_config": {
        // chacha20poly1305 encryption key for client Ids and topic keys. 32 random bytes base64-encoded.
		// Generate your own and keep it secret.
        "key": "4BWm1vZletvrCDGWsF6mex8oBSd59m6I",
        // Key identifier. it is useful when you use multiple keys.
        "identifier":"local",
        // slealed flag tells if key in the configuration is sealed.
        "sealed":false,
        // timestamp is helpful to determine the latest key in case of keyroll over.
        "timestamp":1522325758
    },

    // Topic keys are signed with the encryption key. Set to true to also accept
    // the unsigned keys issued by earlier versions while clients request new keys.
    // Unsigned keys can be edited or forged, so turn it off once clients have moved.
    "accept_unsigned_keys": false,

    // Cluster-mode configuration.
	"cluster_config": {
		// Name of this node. Can be assigned from the command line.
		// Empty string disables clustering.
		"self": "",

		// List of available nodes.
		"nodes": [
			// Name and TCP address of every node in the cluster.
			{"name": "one", "addr":"localhost:12001"},
			{"name": "two", "addr":"localhost:12002"},
			{"name": "three", "addr":"localhost:12003"}
		],

		// Number of nodes storing each published message: its topic's owner
		// and the next nodes on the ring. 1 disables replication.
		"replicas": 2,

		// Publishes and session changes are acknowledged once a replica
		// stored them, up to 1s. true acknowledges express publishes and
		// session changes at once, for lower latency: the last ones before a
		// node crashes can then be lost. Reliable publishes always wait.
		"async_replication": false,

		// A node started with an empty store copies its topics' messages
		// from the others. A message stored without a recorded expiry, by
		// an older version, is kept this long.
		"rebuild_ttl": "24h",

		// On SIGTERM a node leaves the cluster before it closes its clients'
		// connections, and waits this long at most for the others to take
		// over what it holds.
		"drain_timeout": "10s",

		// Highest ring version the cluster routes by: the leader switches to
		// the highest every node supports, up to this. 0 for the latest.
		"ring_version": 0,

		// Failover config.
		"failover": {
			// Failover is enabled.
			"enabled": true,
			// Time in milliseconds between heartbeats.
			"heartbeat": 100,
			// Initiate leader election when the leader is not available for this many heartbeats.
			"vote_after": 8,
			// Consider node failed when it missed this many heartbeats.
			"node_fail_after": 16
		}
	},

	// Database configuration
	"store_config": {
		// reset message store on service restart 
		"reset": false,
		// Configurations of individual adapters.
		"adapters": {
			// unitdb configuration.
			"unitdb": {
				// Name of the database.
				"database": "unitdb",
				// Memdb message store size
				"mem_size": 500000000
			}
		}
	}
}
