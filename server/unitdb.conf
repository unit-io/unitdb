{
    // Default HTTP(S) address:port to listen on for websocket. Either a
	// numeric or a canonical name, e.g. ":80" or ":https". Could include a host name, e.g.
	// "localhost:80".
	// Could be blank: if TLS is not configured, will use ":80", otherwise ":443".
	// Can be overridden from the command line, see option --listen.
	"listen": ":6060",

	// Default HTTP(S) address:port to listen on for grpc. Either a
	// numeric or a canonical name, e.g. ":80" or ":https". Could include a host name, e.g.
	// "localhost:80".
	// Could be blank: if TLS is not configured, will use ":80", otherwise ":443".
	// Can be overridden from the command line, see option --listen.
	"grpc_listen": ":6080",

    // Default logging level is "InfoLevel" so to enable the debug log set the "LogLevel" to "DebugLevel".
	"logging_level": "Error",

    // Maximum message size allowed from client in bytes (262144 = 256KB).
	// Intended to prevent malicious clients from sending very large messages inband (does
	// not affect out-of-band large files).
	"max_message_size": 262144,

	// Maximum number of subscribers per group topic.
	"max_subscriber_count": 128,

    // Encryption configuration
	"encryption_config": {
        // Required. The key client IDs and topic keys are signed with: 32 random
        // characters, for example the output of `openssl rand -base64 24`. Keep
        // it secret, and give every node of a cluster the same key. The
        // UNITDB_ENCRYPTION_KEY environment variable overrides it. A server
        // refuses to start without a key, or with the sample key earlier
        // versions shipped with.
        "key": "",
        // Instead of the key, a keyring, for rotating keys: a file holding a
        // JSON list of keys, [{"id": 1, "key": "<openssl rand -base64 32>",
        // "use": "issue"}, {"id": 0, "key": "<base64 of the old key>", "use":
        // "read"}], with exactly one issue key; the others are only read
        // with. The UNITDB_KEYRING environment variable, holding the same
        // list, overrides it. Every node of a cluster needs the same keyring.
        // See the README for rotating keys.
        "keyring_file": "",
        // Key identifier. it is useful when you use multiple keys.
        "identifier":"local",
        // slealed flag tells if key in the configuration is sealed.
        "sealed":false,
        // timestamp is helpful to determine the latest key in case of keyroll over.
        "timestamp":1522325758
    },

    // How long the v2 client ids the server issues last, as durations such
    // as "720h": client_id_ttl for the ids a primary client requests
    // (unitdb/clientid), primary_id_ttl for primary ones. A client that
    // connects past 80% of its id's lifetime is sent the same id with a new
    // expiry on unitdb/clientid/; an expired id is refused. Empty or "0"
    // never expires.
    "client_id_ttl": "",
    "primary_id_ttl": "",

    // How long a v2 topic key lasts when its keygen request gives no ttl.
    // Empty or "0" never expires.
    "topic_key_ttl": "",

    // Topic keys are signed with the encryption key. Set to true to also accept
    // the unsigned keys issued by earlier versions while clients request new keys.
    // Unsigned keys can be edited or forged, so turn it off once clients have moved.
    "accept_unsigned_keys": false,

    // Set to true to seal every record the server stores (messages, replicas,
    // hints, sessions and their logs, subscriptions, the topic index) with
    // XChaCha20-Poly1305 and a subkey of the keyring's issue key. Records
    // stored before stay readable, and sealed records are still read once it
    // is set to false again, while their key is in the keyring. See the README.
    "encrypt_at_rest": false,

    // Set to true to accept clients that connect with the insecure flag, whose
    // requests then skip every topic key check. For development only: a client
    // that sends the flag is refused without it, and a cluster node refuses to
    // start with it. Trusted backends need no flag: give them a service client
    // id instead (`go run ./server/cmd/mintid -config unitdb.conf -service`).
    "allow_insecure": false,

    // Cluster-mode configuration.
	"cluster_config": {
		// Name of this node. Can be assigned from the command line.
		// Empty string disables clustering.
		"self": "",

		// List of available nodes.
		"nodes": [
			// Name and TCP address of every node in the cluster. A node with
			// "tls" set below also takes cluster connections over mutual TLS on
			// its "tls_addr", e.g. "tls_addr": "localhost:12011", and dials the
			// tls_addr of the nodes that list one.
			{"name": "one", "addr":"localhost:12001"},
			{"name": "two", "addr":"localhost:12002"},
			{"name": "three", "addr":"localhost:12003"}
		],

		// Mutual TLS between nodes, off unless set. Every node has a
		// certificate signed by the cluster's CA naming its node name (as a
		// DNS name), and takes a connection only from a certificate naming
		// another node of "nodes". "require" closes the plain addr: set it
		// once every node is on TLS (docs/rolling-deploys.md).
		// "tls": {
		//	"ca_file": "/etc/unitdb/cluster-ca.crt",
		//	"cert_file": "/etc/unitdb/one.crt",
		//	"key_file": "/etc/unitdb/one.key",
		//	"require": false
		// },

		// Number of nodes storing each published message: its topic's owner
		// and the next nodes on the ring. 1 disables replication.
		"replicas": 2,

		// Publishes and session changes are acknowledged once a replica
		// stored them, up to 1s. true acknowledges express publishes and
		// session changes at once, for lower latency: the last ones before a
		// node crashes can then be lost. Reliable publishes always wait.
		"async_replication": false,

		// A node started with an empty store copies its topics' messages
		// from the others. A message stored without a recorded expiry, by
		// an older version, is kept this long.
		"rebuild_ttl": "24h",

		// On SIGTERM a node leaves the cluster before it closes its clients'
		// connections, and waits this long at most for the others to take
		// over what it holds.
		"drain_timeout": "10s",

		// Highest ring version the cluster routes by: the leader switches to
		// the highest every node supports, up to this. 0 for the latest.
		"ring_version": 0,

		// Failover config.
		"failover": {
			// Failover is enabled.
			"enabled": true,
			// Time in milliseconds between heartbeats.
			"heartbeat": 100,
			// Initiate leader election when the leader is not available for this many heartbeats.
			"vote_after": 8,
			// Consider node failed when it missed this many heartbeats.
			"node_fail_after": 16
		}
	},

	// Database configuration
	"store_config": {
		// reset message store on service restart 
		"reset": false,
		// Configurations of individual adapters.
		"adapters": {
			// unitdb configuration.
			"unitdb": {
				// Name of the database.
				"database": "unitdb",
				// Memdb message store size
				"mem_size": 500000000
			}
		}
	}
}
