version: 2
updates:
  # One pull request a week for every Go dependency with an update, so that
  # they are tested together.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
    ignore:
      # gRPC 1.84.x has GO-2026-6443, fixed in 1.85.
      - dependency-name: google.golang.org/grpc
        versions: ["1.84.x"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
