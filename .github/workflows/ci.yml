name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The minimum go.mod allows, and the latest release.
        go: [go.mod, stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
      - run: go vet ./...
      - run: go test ./...

  # The race detector, on every package but the end-to-end tests, which take
  # ten minutes without it. Most engine fixes were races found by luck. The
  # lockcheck tag checks memdb's locks are taken in their order.
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test -race -tags lockcheck -timeout 20m $(go list ./... | grep -v /server/e2e)

  # Each fuzz target for half a minute: the on-disk formats and recovery, on
  # bytes a bug or a bad disk could leave. Inputs that fail are kept under
  # testdata/fuzz, which go test runs.
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./wal, target: FuzzReadLog }
          - { pkg: ./memdb, target: FuzzRecovery }
          - { pkg: ., target: FuzzDecode }
          - { pkg: ., target: FuzzOpenCorrupt }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test ${{ matrix.pkg }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 30s

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # The correctness checks only: the style and unused-code checks report
      # findings that have not been worked through.
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 -checks 'SA*' ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable
